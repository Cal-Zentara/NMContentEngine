<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nirvana Content Engine</title>
<style>
  @font-face{
    font-family:'Masthic';
    src:url('fonts/Masthic.otf') format('opentype');
    font-weight:400;font-display:swap;
  }
  @font-face{
    font-family:'Futuru';
    src:url('fonts/Futuru-VariableVF.ttf') format('truetype');
    font-weight:300 700;font-display:swap;
  }
  :root{
    --obsidian:#171717;
    --evergreen:#262B22;
    --evergreen-deep:#1E231B;
    --ivory:#EFECE6;
    --limeade:#A3FF3D;
    --muted:#8A8F87;
    --line:rgba(239,236,230,.12);
    --radius:.5rem;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--obsidian);color:var(--ivory);
    font-family:Inter,system-ui,sans-serif;font-weight:300;line-height:1.6;
    min-height:100dvh;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1100px;margin:0 auto;padding:48px 24px 96px}
  @media(min-width:768px){.wrap{padding:72px 48px 120px}}

  .eyebrow{
    font-family:'Futuru',system-ui,sans-serif;
    font-size:11px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--muted);font-weight:500;margin-bottom:20px;
  }
  .eyebrow .lime{color:var(--limeade)}
  .eyebrow.post{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .anglePill{
    background:var(--limeade);color:var(--obsidian);
    padding:5px 12px 4px;border-radius:999px;
    font-weight:800;letter-spacing:.16em;
  }
  .angleOf{color:var(--muted);letter-spacing:.2em}
  h1{font-family:'Masthic',Georgia,serif;font-weight:400;letter-spacing:.01em;
     font-size:clamp(34px,6vw,58px);line-height:1.05;margin-bottom:14px}
  .sub{color:var(--muted);font-size:16px;max-width:46ch}
  .back{
    display:inline-flex;align-items:center;gap:8px;
    color:var(--muted);font-size:13px;
    font-family:'Futuru',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;
    margin-bottom:36px;cursor:pointer;background:none;border:none;transition:color .25s;
  }
  .back:hover{color:var(--ivory)}
  .back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5}

  .screen{display:none}
  .screen.on{display:block;animation:rise .5s cubic-bezier(.16,1,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* topics */
  .topics{display:grid;grid-template-columns:1fr;gap:14px;margin-top:52px}
  @media(min-width:768px){.topics{grid-template-columns:1fr 1fr;gap:18px}}
  .topic{
    background:var(--evergreen);border:1px solid transparent;border-radius:var(--radius);
    padding:28px 26px 24px;cursor:pointer;text-align:left;color:var(--ivory);
    font-family:inherit;transition:border-color .3s,transform .3s;
    animation:rise .6s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*70ms);
  }
  .topic:hover{border-color:var(--limeade)}
  .topic:active{transform:scale(.985)}
  .topic .num{
    font-family:'Futuru',system-ui,sans-serif;font-size:11px;letter-spacing:.22em;
    color:var(--limeade);display:block;margin-bottom:14px;font-weight:500;
  }
  .topic h3{font-family:'Masthic',Georgia,serif;font-weight:400;font-size:24px;line-height:1.15;margin-bottom:8px}
  .topic p{font-size:14px;color:var(--muted)}
  .topic .count{
    display:inline-block;margin-top:16px;font-size:11px;
    font-family:'Futuru',system-ui,sans-serif;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);
  }

  /* post */
  .postwrap{margin-top:36px;max-width:600px}
  .pick{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .badge{
    font-family:'Futuru',system-ui,sans-serif;font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;font-weight:600;background:var(--limeade);color:var(--obsidian);
    padding:6px 11px;border-radius:3px;
  }
  .why{font-size:13px;color:var(--muted)}

  /* two-version switch */
  .switch{display:flex;gap:0;margin-bottom:14px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .switch:empty{display:none}
  .switch button{
    flex:1;background:transparent;border:none;cursor:pointer;
    font-family:'Futuru',system-ui,sans-serif;font-size:12px;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
    padding:15px 10px;transition:background .25s,color .25s;
  }
  .switch button + button{border-left:1px solid var(--line)}
  .switch button:hover{color:var(--ivory)}
  .switch button.on{background:var(--ivory);color:var(--obsidian)}
  .switch button .tick{color:var(--limeade);margin-left:7px}
  .switch button.on .tick{color:#3E7C1E}
  .switch button b{display:block;font-size:12px;letter-spacing:.16em}
  .switch button small{
    display:block;margin-top:5px;font-size:10px;font-weight:500;
    letter-spacing:.04em;text-transform:none;opacity:.62;
  }
  .checkbar{
    display:flex;gap:12px;align-items:flex-start;
    border:1px solid rgba(163,255,61,.4);border-left:4px solid var(--limeade);
    border-radius:var(--radius);padding:15px 18px;margin-bottom:16px;
    font-size:14px;line-height:1.55;color:var(--ivory);
  }
  .checkbar:empty{display:none}
  .checkbar b{
    font-family:'Futuru',system-ui,sans-serif;font-size:10px;font-weight:800;
    letter-spacing:.2em;text-transform:uppercase;color:var(--limeade);
    white-space:nowrap;padding-top:3px;
  }
  .checkbar span{color:#B9B4AA}
  .switchnote{
    font-family:'Futuru',system-ui,sans-serif;font-size:12px;color:var(--muted);
    line-height:1.5;margin-bottom:9px;
  }
  .switchnote:empty{display:none}
  .switchnote b{color:var(--ivory);font-weight:600}

  /* her verdict */
  .verdict{display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
  .verdict:empty{display:none}
  .verdict .q{font-size:14px;color:var(--muted)}
  .verdict button{
    background:transparent;border:1px solid var(--limeade);color:var(--limeade);
    border-radius:var(--radius);cursor:pointer;
    font-family:'Futuru',system-ui,sans-serif;font-size:12px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;padding:12px 18px;
    transition:background .25s,color .25s,transform .2s;
  }
  .verdict button:hover{background:var(--limeade);color:var(--obsidian)}
  .verdict button:active{transform:scale(.97)}
  .verdict .done{font-size:14px;color:var(--limeade);font-weight:400}

  /* the LinkedIn-shaped card: caption on top, image below */
  .card{background:var(--evergreen-deep);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .caption{padding:30px 28px;font-size:16.5px;line-height:1.7;position:relative;cursor:text}
  .caption .inlineedit{
    position:absolute;top:14px;right:14px;
    background:none;border:1px solid var(--line);border-radius:3px;
    font-family:'Futuru',system-ui,sans-serif;font-size:10px;font-weight:600;
    letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    padding:7px 11px;cursor:pointer;transition:color .2s,border-color .2s;
  }
  .caption:hover .inlineedit{color:var(--limeade);border-color:rgba(163,255,61,.5)}
  @media(min-width:768px){.caption{padding:34px 34px}}
  .caption p{margin-bottom:1em}
  .caption p:last-child{margin-bottom:0}
  .imgslot{
    border-top:1px solid var(--line);background:#12160F;
    padding:26px 28px;display:flex;gap:18px;align-items:flex-start;
  }
  .imgslot img{width:100%;border-radius:3px;display:block}
  .imgslot .ph{
    flex:1;border:1px dashed rgba(163,255,61,.35);border-radius:4px;
    padding:20px 20px;font-size:14px;color:var(--muted);line-height:1.55;
  }
  .imgslot .ph b{
    display:block;font-family:'Futuru',system-ui,sans-serif;font-size:10px;
    letter-spacing:.2em;text-transform:uppercase;color:var(--limeade);
    margin-bottom:9px;font-weight:600;
  }
  .imgslot .madewrap{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
  .imgslot .dl{
    display:inline-block;text-decoration:none;margin-top:0;
  }
  .imgslot .ph .lines{
    display:block;font-family:'Futuru',system-ui,sans-serif;font-weight:800;
    text-transform:uppercase;letter-spacing:-.01em;line-height:1.14;
    font-size:19px;color:var(--ivory);
  }
  .imgslot .ph .style{
    display:block;margin-top:14px;padding-top:12px;
    border-top:1px solid rgba(163,255,61,.18);
    font-size:12px;color:#5f6b52;line-height:1.5;
  }
  .imgslot .ph .imgbtn{
    margin-top:14px;background:none;border:1px solid rgba(163,255,61,.45);
    color:var(--limeade);font-family:'Futuru',system-ui,sans-serif;
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;
    padding:9px 14px;border-radius:3px;cursor:pointer;
  }
  .imgslot .ph .imgbtn:hover{background:rgba(163,255,61,.1)}

  .actions{display:flex;align-items:center;gap:18px;margin-top:24px;flex-wrap:wrap}
  .copy{
    display:inline-flex;align-items:center;gap:10px;
    background:var(--limeade);color:var(--obsidian);border:none;border-radius:var(--radius);
    font-family:'Futuru',system-ui,sans-serif;font-weight:600;font-size:13px;
    letter-spacing:.14em;text-transform:uppercase;padding:16px 26px;cursor:pointer;
    transition:transform .2s;
  }
  .copy:hover{transform:translateY(-1px)}
  .copy:active{transform:scale(.97)}
  .copy svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
  .meta{font-size:12.5px;color:var(--muted)}
  .meta .edited{color:var(--limeade)}
  .ghost{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:var(--radius);cursor:pointer;
    font-family:'Futuru',system-ui,sans-serif;font-size:12px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;padding:15px 20px;
    transition:border-color .25s,color .25s,transform .2s;
  }
  .ghost:hover{border-color:var(--ivory);color:var(--ivory)}
  .ghost:active{transform:scale(.97)}
  .ghost.go{border-color:var(--limeade);color:var(--limeade)}
  .ghost.go:hover{background:var(--limeade);color:var(--obsidian)}

  /* edit mode */
  #capEdit{
    display:none;width:100%;background:transparent;border:none;outline:none;resize:none;
    color:var(--ivory);font-family:Inter,system-ui,sans-serif;font-weight:300;
    font-size:16.5px;line-height:1.7;padding:30px 28px;min-height:260px;
  }
  @media(min-width:768px){#capEdit{padding:34px}}
  .card.editing{border-color:var(--limeade)}
  .card.editing #capBody{display:none}
  .card.editing #capEdit{display:block}
  .editnote{
    margin-top:14px;font-size:13px;color:var(--muted);max-width:60ch;
  }
  .editnote:empty{display:none}
  .editnote .lime{color:var(--limeade)}

  /* alternates */
  /* only appears once she's actually edited this post */
  .sendedit{
    display:none;background:var(--limeade);color:var(--obsidian);border:none;
    font-family:'Futuru',system-ui,sans-serif;font-size:11px;font-weight:800;
    letter-spacing:.18em;text-transform:uppercase;
    padding:15px 24px;border-radius:3px;cursor:pointer;white-space:nowrap;
    transition:opacity .2s;
  }
  .sendedit.on{display:inline-block}
  .sendedit:hover{opacity:.85}
  .sendedit:disabled{opacity:.55;cursor:default}
  .sendstate{
    font-family:'Futuru',system-ui,sans-serif;font-size:12.5px;
    color:var(--limeade);margin-top:12px;min-height:1px;
  }
  .actions.top{margin-top:0;margin-bottom:20px}
  .sendstate:empty{display:none}

  .alts{margin-top:44px;max-width:600px}
  .alts .lede{
    font-family:'Futuru',system-ui,sans-serif;font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--muted);margin-bottom:16px;
  }
  .angle{
    background:transparent;border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 22px;cursor:pointer;text-align:left;color:var(--ivory);
    font-family:inherit;width:100%;display:block;margin-bottom:12px;
    transition:border-color .3s,background .3s,transform .3s;
    animation:rise .5s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*80ms);
  }
  .angle:hover{border-color:var(--limeade);background:var(--evergreen)}
  .angle:active{transform:scale(.99)}
  .angle .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
  .tag{
    font-family:'Futuru',system-ui,sans-serif;font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;font-weight:500;padding:5px 10px;border-radius:3px;
  }
  .tag.type{background:rgba(239,236,230,.08);color:var(--ivory)}
  .tag.goal{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .tag.used{background:var(--limeade);color:var(--obsidian)}
  .angle .hook{font-size:15px;line-height:1.5;color:var(--muted);max-width:62ch}
  .angle:hover .hook{color:var(--ivory)}

  footer{
    margin-top:90px;padding-top:26px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;
    gap:14px;flex-wrap:wrap;
  }
  footer button{
    background:none;border:none;color:var(--muted);cursor:pointer;
    font-size:12.5px;font-family:inherit;text-decoration:underline;
  }
  footer button:hover{color:var(--ivory)}
</style>
</head>
<body>

<div class="wrap">

  <section class="screen on" id="s-topics">
    <div class="eyebrow">Nirvana <span class="lime">&middot;</span> Content Engine</div>
    <h1>What are we posting?</h1>
    <p class="sub">Pick a topic and a finished post is waiting: the copy and the graphic that carries it. Some are written two ways, tap between them and tell us which one sounds like you.</p>
    <div class="topics" id="topicGrid"></div>
  </section>

  <section class="screen" id="s-post">
    <button class="back" onclick="goBack()">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      Topics
    </button>
    <div class="eyebrow" id="postEyebrow"></div>
    <h1 id="postTitle"></h1>
    <div class="postwrap">
      <div class="pick" id="pickRow"></div>
      <div class="checkbar" id="checkBar"></div>
      <div class="switchnote" id="switchNote"></div>
      <div class="switch" id="verSwitch"></div>
      <div class="actions top">
        <button class="copy" onclick="copyPost()">
          <span id="copyLabel">Copy caption</span>
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <button id="sendBtn" class="sendedit" onclick="exportFeedback()">Save and send edits to Chris</button>
        <span class="meta" id="postMeta"></span>
      </div>
      <p class="sendstate" id="sendState"></p>
      <div class="card" id="card">
        <div class="caption" id="capBody"></div>
        <textarea id="capEdit" spellcheck="true"></textarea>
        <div class="imgslot" id="imgSlot"></div>
      </div>
      <p class="editnote" id="editNote"></p>
    </div>
    <div class="alts" id="altList"></div>
  </section>

  <footer>
    <div>Drafts by the Nirvana Content Engine &middot; nothing publishes without you</div>
    <div style="display:flex;gap:18px;flex-wrap:wrap">
      <button onclick="resetUsed()">Reset posted marks</button>
    </div>
  </footer>
</div>

<script>
/* Chase-style: the image IS the post. Caption is 2-4 short lines. */
const TOPICS = [
{
 num:"01", lead:0, title:"The cancels nobody chose",
 desc:"Customers who disappeared without ever hitting cancel.",
 angles:[
  {type:"Data drop", goal:"Builds authority", why:"one number, impossible to argue with",
   text:`Most of your churn isn't churn.

It's expired credit cards.

2 to 4 in 10 of the customers you "lost" never clicked cancel. Their card expired or the charge declined, and the retry never worked.

Fix the retries and add a card updater before you touch anything else. You already paid to acquire these people and they never decided to leave, so winning them back costs you nothing but the fix.`,
   img:`Ten cardboard boxes in a row. Six solid, four drawn as faded dotted outlines. Below them a cracked credit card marked EXP with an arrow pointing at the missing four.`},

  {type:"Contrarian", goal:"Grows the audience", why:"names a framework she can own",
   text:`Churn has three doors.

Most brands only guard one.

Voluntary: they chose to leave.
Involuntary: the card failed and nobody chose anything.
Passive: the product arrives faster than they use it.

Same number on your dashboard. Three completely different repairs.

Split one month of cancels into those three buckets. Whichever is biggest tells you which team owns the fix.`,
   img:`Three simple doors drawn side by side, labeled "chose to leave", "card failed", "too much product". One door has a guard standing at it. The other two are wide open.`},

  {type:"Teardown", goal:"Brings buyers", why:"a rewrite they can copy today",
   text:`Your failed payment email reads like a parking ticket.

It should read like a favor.

"Your payment has failed" is an accusation. "Looks like your card slipped, update it in ten seconds" is a helping hand.

Same ask. Very different recovery rate.

Go read your own failed payment email out loud. If it sounds like a fine, rewrite it as a favor.`,
   img:`Two emails side by side. Left one stamped like a parking ticket, cold and official. Right one drawn as a friendly handwritten note. Big arrow from left to right.`},

  {type:"Framework", goal:"Builds authority", why:"three fixes ranked by effort",
   text:`Three fixes for failed payments, in order of effort.

1. Retry on payday instead of the next morning.
2. Write the email like a favor, not a fine.
3. Ask for the new card before the old one expires.

The third one is the only one that stops it happening.

Start there. A card updater runs once and quietly removes the problem instead of chasing it every month.`,
   img:`A three rung ladder. Bottom rung labeled "retry later", middle rung "email like a human", top rung "update the card early". The top rung drawn faded and unused, cobwebs on it.`},

  {type:"Story", goal:"Grows the audience", why:"puts a human in the number",
   text:`Some of your customers never decided to leave.

They just got a new card.

Nobody sits down and chooses that. The old number stops working, the charge declines, and a subscription they were happy with quietly stops.

Your dashboard files it under churn. It belongs under billing.

Ask your billing platform how many of last month's cancels were declines. That number surprises most founders.`,
   img:`A wallet with a fresh replacement card in it, the old one cut in half beside it, and a subscription box in the background going unopened.`}
]},
{
 num:"02", lead:1, title:"The cancel button",
 desc:"What happens in the last sixty seconds decides who stays.",
 angles:[
  {type:"Contrarian", goal:"Builds authority", why:"kills the reflex everyone has",
   text:`The panic discount doesn't save the customer.

It saves the month.

Then it teaches your best people that the exit is where the deals live.

Most subscribers don't leave over price. A cheaper version of something they stopped using still cancels next month.

Ask what changed before you offer anything. Most answers are about fit, not price.`,
   img:`A bucket with a coupon taped over a hole in the side, water still pouring out of the gap around it.`},

  {type:"Teardown", goal:"Brings buyers", why:"she tested six brands herself",
   text:`I tried to cancel six subscriptions last week.

Five threw a coupon at me before asking a single question.

The sixth asked one thing: is this too much product, or the wrong product?

I said too much. It moved me to every eight weeks. I'm still a customer.

Ask the question before you offer the discount. The answer is usually a frequency change, not a price change.`,
   img:`Six phone screens in a grid. Five show a big discount badge. The sixth shows a simple question with two options. The sixth one is circled.`},

  {type:"Framework", goal:"Grows the audience", why:"three steps anyone can implement",
   text:`A cancel flow has three jobs, in order.

Ask why they're leaving. Answer that exact reason. Save the discount for last.

Most brands skip straight to step three and wonder why the save never sticks.

The save isn't in the coupon. It's in the question.

Move the discount to the last screen and put a question on the first. Same flow, different outcome.`,
   img:`Three numbered steps drawn as a staircase: ASK, ANSWER, then a small discount tag at the top. Most brands jump straight to step 3, drawn as a dotted leap over the first two.`},

  {type:"Story", goal:"Grows the audience", why:"reframes the exit as a gift",
   text:`The cancel screen is the most honest conversation you'll ever have with a customer.

They've already decided. There's nothing left to protect.

Ask and they'll tell you the truth: too much, too expensive, didn't work, forgot why I signed up.

Most brands use that moment to shout a discount over the top of it.

Put one open question on that screen this week and read what comes back.`,
   img:`Two people at a doorway, one halfway out and mid sentence. The other holding up a giant discount sign that covers their own face and ears.`},

  {type:"Teardown", goal:"Builds authority", why:"a ten second audit of their own flow",
   text:`Open your own cancel flow and count two things.

How many clicks it takes to leave. How many questions you ask on the way out.

Most brands are two clicks and zero questions.

Every one of those exits was carrying the reason you're losing everyone else, and you traded it for a 10% coupon.

Add one question before the coupon, even a dropdown. You'll learn more in a month than a year of surveys.`,
   img:`A turnstile with two arrows and no signage, people walking straight through. Beside it a clipboard on the floor, blank, still in its wrapper.`}
]},
{
 num:"03", lead:0, title:"After the first box",
 desc:"The two weeks between buying and believing.",
 angles:[
  {type:"Teardown", goal:"Brings buyers", why:"an audit they can run on themselves today",
   text:`Here's the first thirty days at most subscription brands.

A receipt. Then the box, and silence. Then a promo for something they haven't opened yet. Then a second charge, by which point they've forgotten why they signed up.

The emails are clean. The open rates are fine. The subscribers leave anyway.

Subscribe to your own brand with your own card and read what lands in the first thirty days.`,
   img:`A calendar timeline with four marked days. Day 0 a receipt, Day 3 a box with a silence symbol, Day 9 a discount tag, Day 30 a charge with a question mark. The gaps between are shaded empty.`},

  {type:"Framework", goal:"Builds authority", why:"one free message that saves renewals",
   text:`The first ten days decide whether they stay ten months.

Week one is when the habit forms. If they use the thing and feel it working, the next charge is a receipt for something they already value.

If they don't, it's a bill for a box in the cupboard.

Send one message the day it ships: how to use it, and when they'll see a result. That's it. That's the fix.`,

   text:`I've told three clients this year to email less.

/* ============ THE LOCKED GRAPHIC STYLE ============
   Paula Scher Public Theater posters. Erica's own Notion page names Scher as
   her design reference. The type IS the image. Every rule below was learned
   the hard way across ~20 test generations. */

const IMG_STYLE =
`Paula Scher Public Theater poster. The type IS the image. No illustration, no \
icons, no photographs, no people.
Three colours only: near-black #171717, off-white #EFECE6, lime green #A3FF3D.
Massive condensed sans-serif capitals packed edge to edge, almost no margin, \
every line stretched to fill the full width of its column. Wildly mixed sizes \
stacked hard against each other with almost no leading. Asymmetric and chaotic, \
never centred or evenly spaced. Thick rules of varying weight separating blocks.
Flat vintage letterpress. Hard flat colour, high contrast. No gradients, no \
shadows, no glow, no 3D, no texture overlay. Spelling must be exact. Portrait 3:4.`;

/* rotated so consecutive posters never match */
const COMPOSITIONS = [
  'Vertical spine: the accent word rotated 90 degrees running the full height up the left edge, everything else stacked to its right.',
  'Split column: the frame divided into two uneven vertical columns, giant type left, a tight stack of short lines right.',
  'Centre punch: one enormous hollow outlined line owning the middle two thirds, smaller lines crushed above and below it.',
  'Corner block: the accent block anchored in a corner and rotated off the grid, type wrapping around it.',
  'Ladder: each line a wildly different size, alternating solid and hollow, no two treated alike.',
  'Banner top: a thick accent bar across the very top holding the first line, giant type filling everything below.'
];
const COLOR_MODES = [
  'Near-black #171717 background, off-white type. One line set inside a solid lime block with near-black knockout letters.',
  'Full lime #A3FF3D background, near-black type. One line set inside a solid near-black block with lime letters.',
  'Off-white #EFECE6 background, near-black type. One line set inside a solid near-black block with lime letters. Never lime on off-white, the contrast is too weak, and keep all small text near-black.'
];
const DECOR = [
  'stacked rule bars of decreasing width used as texture, evenly spaced and clearly rules, never mistakable for collapsed letters',
  'a solid filled circle badge with short knockout text inside it',
  'a rotated block of type sitting at an angle against the grid',
  'heavy bracket or corner rules framing part of the composition',
  'a hairline rule running against a very thick one',
  'one word reversed out of a filled bar that breaks past the edge of the frame'
];

function posterFor(i,j){
  const n = i * 5 + j;                       /* global index, drives rotation */
  return {
    comp:  COMPOSITIONS[n % 6],
    color: COLOR_MODES[n % 3],
    decor: [DECOR[n % 6], DECOR[(n + 2) % 6]]
  };
}

/* One version per post. The two-voice toggle was retired once every post
   got a Max hook: the versions read the same and the choice was friction.
   ALT is kept below as the raw second drafts, unused by the app. */
function versions(i,j){
  const a = TOPICS[i].angles[j];
  const hook = HOOKS[i + ':' + j];
  return [hook ? hook + '\n\n' + a.text : a.text];
}
/* what's actually on screen: her edit if she made one, else ours */
function currentText(){
  return edits[editId(curTopic,curAngle,curVer)] ?? versions(curTopic,curAngle)[curVer];
}

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  const el = document.getElementById(id);
  void el.offsetWidth;
  el.classList.add('on');
  window.scrollTo({top:0});
}

function renderTopics(){
  document.getElementById('topicGrid').innerHTML = TOPICS.map((t,i) => `
    <button class="topic" style="--i:${i}" onclick="goTopic(${i})">
      <span class="num">${t.num}</span>
      <h3>${t.title}</h3>
      <p>${t.desc}</p>
      <span class="count">${t.angles.length} angles</span>
    </button>`).join('');
}

function pickFor(i){
  const t = TOPICS[i];
  const order = [t.lead, ...t.angles.map((_,j)=>j).filter(j => j !== t.lead)];
  return order.find(j => !used.has(angleId(i,j))) ?? t.lead;
}

function openPost(i, j, v){
  curTopic = i; curAngle = j;
  const t = TOPICS[i], a = t.angles[j];
  const vs = versions(i,j);
  const key = angleId(i,j);
  /* default to whichever she already picked, else version 1 */
  curVer = (v !== undefined) ? v : (voice[key] ?? 0);
  if (curVer >= vs.length) curVer = 0;
  const eKey = editId(i,j,curVer);
  const isEdited = edits[eKey] !== undefined;
  const body = edits[eKey] ?? vs[curVer];
  endEdit();

  const eb = document.getElementById('postEyebrow');
  eb.className = 'eyebrow post';
  eb.innerHTML =
    `<span>Topic ${t.num}</span>`
    + `<span class="anglePill">${a.type}</span>`
    + `<span class="angleOf">angle ${j+1} of ${t.angles.length}</span>`;
  document.getElementById('postTitle').textContent = t.title;

  document.getElementById('pickRow').innerHTML = (j === t.lead)
    ? `<span class="badge">Post this one</span><span class="why">${a.goal} &middot; ${a.why}</span>`
    : `<span class="tag type">${a.type}</span><span class="why">${a.goal} &middot; ${a.why}</span>`;

  /* the send button only exists once she's edited this post */
  const sBtn = document.getElementById('sendBtn');
  if (sBtn){
    sBtn.classList.toggle('on', isEdited);
    sBtn.disabled = false;
    sBtn.textContent = 'Save and send edits to Chris';
  }
  const sState = document.getElementById('sendState');
  if (sState) sState.textContent = '';

  const chk = CHECK[i + ':' + j];
  document.getElementById('checkBar').innerHTML = chk
    ? `<b>Check first</b><span>This post uses <b style="color:#EFECE6;letter-spacing:0;text-transform:none;font-size:14px;font-family:inherit">${chk}</b>. Swap in your real numbers before it goes out, or tell us to cut the claim.</span>`
    : '';

  /* the two-version switch, only when there IS a second version */
  const VNAME = ['Sharp', 'Casual'];
  const VSUB  = ['Short declarative lines', "Max Sturtevant's first-person style"];
  document.getElementById('switchNote').innerHTML = vs.length < 2 ? '' :
    `Same post, written two ways. <b>Pick the one that sounds like you</b> &mdash; whichever you copy is saved as your voice.`;
  document.getElementById('verSwitch').innerHTML = vs.length < 2 ? '' :
    vs.map((_,n) => `
      <button class="${n===curVer?'on':''}" onclick="setVer(${n})"><b>${VNAME[n]}</b><small>${VSUB[n]}</small></button>`).join('');

  document.getElementById('capBody').onclick = e => {
    if (!e.target.closest('.inlineedit')) startEdit();
  };
  document.getElementById('capBody').innerHTML =
    `<button class="inlineedit" onclick="startEdit()">Edit</button>`
    + body.split('\n\n').map(p => '<p>' + p.replace(/\n/g,'<br>') + '</p>').join('');

  const made = FILES[i + ':' + j];
  document.getElementById('imgSlot').innerHTML = made
    ? `<div class="madewrap">
         <img src="${made}" alt="">
         <a class="imgbtn dl" href="${made}" download="nirvana-${TOPICS[i].num}-${j+1}.png">Download image</a>
       </div>`
    : (() => {
        const p = POSTERS[i + ':' + j], r = posterFor(i, j);
        return `<div class="ph"><b>The poster</b>
          <span class="lines">${p.lines.join('<br>')}</span>
          <span class="style">${r.color.split('.')[0]} &middot; ${r.comp.split(':')[0]} &middot; accent word &ldquo;${p.accent}&rdquo;</span>
          <button class="imgbtn" onclick="copyImgPrompt()">Copy image prompt</button>
         </div>`;
      })();

  const words = body.split(/\s+/).length;
  document.getElementById('postMeta').innerHTML =
    `${words} words` + (used.has(angleId(i,j)) ? ' · already posted' : '')
    + (isEdited ? ' · <span class="edited">your edit</span>' : '');
  document.getElementById('copyLabel').textContent = 'Copy caption';

  document.getElementById('editNote').innerHTML = isEdited
    ? `You rewrote this one. <span class="lime">The engine reads your changes and writes the next batch closer to them.</span>
       <button class="ghost" style="padding:6px 12px;margin-left:8px" onclick="revertEdit()">Undo my edit</button>`
    : '';

  const others = t.angles.map((a2,k)=>({a2,k})).filter(o => o.k !== j);
  document.getElementById('altList').innerHTML =
    `<div class="lede">Or take it from another angle</div>` +
    others.map((o,n) => {
      const hook = o.a2.text.split('\n')[0];
      const isUsed = used.has(angleId(i,o.k));
      return `
      <button class="angle" style="--i:${n}" onclick="goPost(${i},${o.k})">
        <div class="row">
          <span class="tag type">${o.a2.type}</span>
          <span class="tag goal">${o.a2.goal}</span>
          ${isUsed ? '<span class="tag used">Posted</span>' : ''}
        </div>
        <div class="hook">&ldquo;${hook}&rdquo;</div>
      </button>`;
    }).join('');

  show('s-post');
}

/* ============ EDITING ============ */
let editing = false;
function startEdit(){
  if (editing) return saveEdit();
  editing = true;
  const ta = document.getElementById('capEdit');
  ta.value = currentText();
  document.getElementById('card').classList.add('editing');
  const btn = document.querySelector('#capBody .inlineedit');
  if (btn){ btn.textContent = 'Save'; btn.classList.add('go'); }
  const sBtn = document.getElementById('sendBtn');   /* offer it while she types */
  if (sBtn){ sBtn.classList.add('on'); sBtn.disabled = false; sBtn.textContent = 'Save and send edits to Chris'; }
  ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px';
  ta.focus();
}
function saveEdit(){
  const ta = document.getElementById('capEdit');
  const text = ta.value.trim();
  const eKey = editId(curTopic,curAngle,curVer);
  const original = versions(curTopic,curAngle)[curVer];
  if (!text || text === original) delete edits[eKey];
  else edits[eKey] = text;
  saveEdits();
  editing = false;
  openPost(curTopic, curAngle, curVer);
  queueSend();
}

/* Every save goes to Chris. Batched: if she's mid-session and saves five
   posts in a row, that's one email with all five, not five emails. */
let sendTimer = null;
function queueSend(){
  clearTimeout(sendTimer);
  const s = document.getElementById('sendState');
  if (s) s.textContent = 'Saved. Sending to Chris automatically, or hit the button now.';
  sendTimer = setTimeout(function(){ exportFeedback(true); }, 60000);
}
function endEdit(){
  editing = false;
  const card = document.getElementById('card');
  if (card) card.classList.remove('editing');
  const btn = document.querySelector('#capBody .inlineedit');
  if (btn){ btn.textContent = 'Edit'; btn.classList.remove('go'); }
}
function revertEdit(){
  delete edits[editId(curTopic,curAngle,curVer)];
  saveEdits();
  openPost(curTopic, curAngle, curVer);
}

function setVer(n){ openPost(curTopic, curAngle, n); }
function pickVoice(n){ voice[angleId(curTopic,curAngle)] = n; saveVoice(); openPost(curTopic, curAngle, n); }
function clearVoice(){ delete voice[angleId(curTopic,curAngle)]; saveVoice(); openPost(curTopic, curAngle, curVer); }

function showTopics(){ show('s-topics'); }
function goTopic(i){
  const j = pickFor(i);
  history.pushState({v:'post',t:i,a:j}, '', '#' + TOPICS[i].num + '-' + (j+1));
  openPost(i,j);
}
function goPost(i,j){
  history.replaceState({v:'post',t:i,a:j}, '', '#' + TOPICS[i].num + '-' + (j+1));
  openPost(i,j);
}
function goBack(){ history.back(); }
function applyState(s){
  if (!s || s.v === 'topics'){ showTopics(); return; }
  if (s.v === 'post'){ openPost(s.t, s.a); }
}
window.addEventListener('popstate', e => applyState(e.state));

function copyPost(){
  if (editing) saveEdit();
  const body = currentText();
  const done = () => {
    document.getElementById('copyLabel').textContent = 'Copied';
    used.add(angleId(curTopic,curAngle)); saveUsed();
    /* copying IS a vote — whatever she actually took is the voice she wants */
    if (versions(curTopic,curAngle).length > 1 && voice[angleId(curTopic,curAngle)] === undefined){
      voice[angleId(curTopic,curAngle)] = curVer; saveVoice();
    }
    document.getElementById('postMeta').textContent =
      body.split(/\s+/).length + ' words · already posted';
    setTimeout(() => { document.getElementById('copyLabel').textContent = 'Copy caption'; }, 2200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(body).then(done).catch(() => fallbackCopy(body, done));
  } else fallbackCopy(body, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta); done();
}
function resetUsed(){
  used.clear(); saveUsed();
  if (curTopic !== null && document.getElementById('s-post').classList.contains('on')) openPost(curTopic, curAngle);
}

/* everything she taught the engine, emailed straight to Chris */
const FORM_ENDPOINT = 'https://formspree.io/f/mnjeebed';

function feedbackBody(){
  const out = [];
  Object.entries(edits).forEach(([k,text]) => {
    const [i,j,v] = k.split(':').map(Number);
    out.push(
`EDIT — ${TOPICS[i].title} / ${TOPICS[i].angles[j].type}
OURS:
${versions(i,j)[v] ?? versions(i,j)[0]}
HERS:
${text}`);
  });
  return out;
}

async function exportFeedback(auto){
  /* the label promises a save, so honour it if she's still typing */
  if (!auto && editing) saveEdit();
  const out = feedbackBody();
  if (!out.length){
    if (!auto) alert('Nothing to send yet. Edit a post first, then send.');
    return;
  }
  const state = document.getElementById('sendState');
  const btn = document.getElementById('sendBtn');
  const was = btn ? btn.textContent : '';
  if (state) state.textContent = 'Sending to Chris…';
  if (btn && !auto){ btn.textContent = 'Sending…'; btn.disabled = true; }

  const payload = {
    from: 'Nirvana Content Engine',
    edits: out.length,
    posted: [...used].length,
    feedback: out.join('\n\n----\n\n')
  };

  try {
    const res = await fetch(FORM_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('send failed');
    const n = out.length;
    if (state) state.textContent = `Sent to Chris · ${n} edit${n>1?'s':''} so far`;
    if (btn){ btn.textContent = 'Sent'; btn.disabled = true; }
    if (!auto) alert(`Sent. ${n} edit${n>1?'s':''} are on their way to Chris.`);
  } catch (e) {
    /* offline or blocked — nothing is lost, her edits are still saved here */
    if (state) state.textContent = "Couldn't send. Your edits are safe here, we'll try again on the next save.";
    if (btn && !auto){ btn.textContent = was; btn.disabled = false; }
    if (!auto){
      navigator.clipboard?.writeText(`Nirvana Content Engine — feedback\n\n${out.join('\n\n----\n\n')}`);
      alert("Couldn't send just now, so your edits are copied to the clipboard instead. Paste them to Chris and nothing is lost.");
    }
  }
}

/* if she closes the tab with a send still pending, fire it now */
window.addEventListener('beforeunload', function(){
  if (!sendTimer) return;
  clearTimeout(sendTimer);
  const out = feedbackBody();
  if (!out.length || !navigator.sendBeacon) return;
  navigator.sendBeacon(FORM_ENDPOINT, new Blob([JSON.stringify({
    from: 'Nirvana Content Engine (tab closed)',
    edits: out.length,
    feedback: out.join('\n\n----\n\n')
  })], {type:'application/json'}));
});

renderTopics();
history.replaceState({v:'topics'}, '', location.pathname + location.search);
</script>
